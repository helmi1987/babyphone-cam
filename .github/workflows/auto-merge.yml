# Push to claude/** -> image build (image.yml, pushes the branch tag) -> merge into main
# -> image build of main (latest) -> delete the claude/** branches already contained in main.
# Never touches other branches (webpage, memory). A push with GITHUB_TOKEN starts no workflow,
# so the build of main is dispatched explicitly.
name: Auto-merge

on:
  push:
    branches: ['claude/**']

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit

  merge:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: auto-merge-main
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Merge the branch into main
        env:
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset -q --hard origin/main
            if git merge-base --is-ancestor "$SHA" HEAD; then
              echo "$SHA is already in main"; exit 0
            fi
            git fetch origin "$SHA" || git fetch origin "$BRANCH"
            if ! git merge --ff-only "$SHA"; then
              git merge --no-ff --no-edit -m "Merge branch '$BRANCH' into main" "$SHA"
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (main changed), attempt $attempt"
            sleep $((attempt * 20))
          done
          exit 1

      - name: Build the image of main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run image.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Delete merged claude/** branches
        run: |
          set -euo pipefail
          git fetch origin main
          git fetch --prune origin '+refs/heads/claude/*:refs/remotes/origin/claude/*'
          git for-each-ref --format='%(refname:strip=3) %(objectname)' 'refs/remotes/origin/claude/' |
          while read -r branch sha; do
            if git merge-base --is-ancestor "$sha" origin/main; then
              # The lease keeps commits pushed after the fetch.
              git push origin --delete --force-with-lease="refs/heads/$branch:$sha" "$branch" ||
                echo "Kept $branch (changed or already gone)"
            fi
          done
