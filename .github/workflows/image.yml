# Builds the container image and pushes it to ghcr.io/<owner>/babyphone-cam.
# Dependabot PRs are built without push and merged automatically for
# patch and minor updates once the build passed.
# claude/** branches are built by auto-merge.yml (image-build.yml), which merges them into main afterwards.
name: image

on:
  push:
    branches: ['**', '!memory', '!dependabot/**', '!claude/**']
    tags: ['v*']
    paths-ignore: ['docs/**', '**/*.md', 'compose/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Weekly rebuild of main with fresh base image and Debian security updates
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/image-build.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit

  automerge:
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - id: dep
        uses: dependabot/fetch-metadata@v3
      - name: Merge patch and minor updates
        if: steps.dep.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge --squash --delete-branch "$PR"
          # A merge by GITHUB_TOKEN triggers no push workflow: build main explicitly
          gh workflow run image.yml --repo "$GITHUB_REPOSITORY" --ref main
