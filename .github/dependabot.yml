# Weekly update PRs for npm packages, the Node base image and Actions.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      npm: { patterns: ['*'] }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    # Node major versions (odd ones are not LTS) are switched by hand
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
