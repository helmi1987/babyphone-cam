# Values come from .env next to this file (template: .env.example).
name: babyphone

services:
  babyphone:
    image: ghcr.io/helmi1987/babyphone-cam:${BABYPHONE_VERSION:-latest}
    container_name: babyphone
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp:size=16m]
    cap_drop: [ALL]
    # Only for the entrypoint: chown DATA_DIR, then switch to PUID:PGID
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 80
    pids_limit: 200
    environment:
      - TZ=${TZ:-}
      - PUID=${PUID:-99}
      - PGID=${PGID:-100}
      # Access
      - PARENT_PIN=${PARENT_PIN:?PARENT_PIN is missing in .env}
      - CHILD_PIN=${CHILD_PIN:?CHILD_PIN is missing in .env}
      - CHILD_NAMES=${CHILD_NAMES:-}
      - ALLOWED_CIDRS=${ALLOWED_CIDRS:-}
      - HOSTS=${HOSTS:-}
      # Network
      - ANNOUNCED_IP=${BABYPHONE_IP}
      - HTTPS_PORT=443
      - HTTP_PORT=80
      - RTC_PORT=${RTC_PORT:-40000}
      # HTTPS: folder
      - TLS_CERT=${TLS_CERT:-}
      - TLS_KEY=${TLS_KEY:-}
      - CERTS_DIR=/certs
      # HTTPS: Cert Warden (replaces the folder)
      - CERTWARDEN_ENDPOINT_URL=${CERTWARDEN_ENDPOINT_URL:-}
      - CERT_NAME=${CERT_NAME:-}
      - CERT_CERT_API=${CERT_CERT_API:-}
      - CERT_KEY_API=${CERT_KEY_API:-}
      - CERT_CHECK_DAY=${CERT_CHECK_DAY:-30}
      # Presence and alarms
      - HEARTBEAT_TIMEOUT=${HEARTBEAT_TIMEOUT:-20}
      - ALARM_DELAY=${ALARM_DELAY:-30}
      - OFFLINE_TIMEOUT=${OFFLINE_TIMEOUT:-600}
      - ALARM_UNACKED_DELAY=${ALARM_UNACKED_DELAY:-60}
      - SOUND_THRESHOLD=${SOUND_THRESHOLD:-25}
      - MOTION_THRESHOLD=${MOTION_THRESHOLD:-4}
      # Webhooks (up to 5: WEBHOOK_1_* .. WEBHOOK_5_*)
      - WEBHOOK_TEST=${WEBHOOK_TEST:-}
      - WEBHOOK_1_URL=${WEBHOOK_1_URL:-}
      - WEBHOOK_1_METHOD=${WEBHOOK_1_METHOD:-POST}
      - WEBHOOK_1_HEADERS=${WEBHOOK_1_HEADERS:-}
      - WEBHOOK_1_BODY=${WEBHOOK_1_BODY:-}
      - WEBHOOK_1_EVENTS=${WEBHOOK_1_EVENTS:-}
      - WEBHOOK_2_URL=${WEBHOOK_2_URL:-}
      - WEBHOOK_2_METHOD=${WEBHOOK_2_METHOD:-POST}
      - WEBHOOK_2_HEADERS=${WEBHOOK_2_HEADERS:-}
      - WEBHOOK_2_BODY=${WEBHOOK_2_BODY:-}
      - WEBHOOK_2_EVENTS=${WEBHOOK_2_EVENTS:-}
      - WEBHOOK_3_URL=${WEBHOOK_3_URL:-}
      - WEBHOOK_3_METHOD=${WEBHOOK_3_METHOD:-POST}
      - WEBHOOK_3_HEADERS=${WEBHOOK_3_HEADERS:-}
      - WEBHOOK_3_BODY=${WEBHOOK_3_BODY:-}
      - WEBHOOK_3_EVENTS=${WEBHOOK_3_EVENTS:-}
    volumes:
      - ${DATA_DIR:-/mnt/user/appdata/babyphone}:/data
      - ${CERTS_DIR:-/mnt/user/appdata/Nginx-Proxy-Manager-Official/letsencrypt}:/certs:ro
    networks:
      br0:
        ipv4_address: ${BABYPHONE_IP:?BABYPHONE_IP is missing in .env}
    labels:
      net.unraid.docker.webui: ${WEBUI:-https://[IP]/}
      net.unraid.docker.icon: https://raw.githubusercontent.com/helmi1987/babyphone-cam/main/.github/icons/babyphone.png
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  br0:
    external: true
