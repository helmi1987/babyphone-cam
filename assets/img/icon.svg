  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- stars -->
  <circle cx="392" cy="96" r="7" fill="#fff" opacity=".85"/>
  <circle cx="436" cy="150" r="4.5" fill="#fff" opacity=".7"/>
  <circle cx="352" cy="58" r="4" fill="#fff" opacity=".6"/>
