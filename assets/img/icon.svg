  <path d="M436 196 q36 66 0 132" stroke="#3ecf6e" stroke-width="18" fill="none" stroke-linecap="round" opacity=".7"/>
  <path d="M114 222 q-22 40 0 80" stroke="#3ecf6e" stroke-width="18" fill="none" stroke-linecap="round"/>
  <path d="M76 196 q-36 66 0 132" stroke="#3ecf6e" stroke-width="18" fill="none" stroke-linecap="round" opacity=".7"/>
</svg>
