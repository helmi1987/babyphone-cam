  <!-- camera stand -->
  <path d="M236 352 h40 l22 70 h-84z" fill="#c7cde0"/>
  <rect x="176" y="414" width="160" height="30" rx="15" fill="url(#body)"/>
  <!-- camera head -->
  <circle cx="256" cy="262" r="116" fill="url(#body)"/>
  <circle cx="256" cy="262" r="74" fill="#1b2250"/>
  <circle cx="256" cy="262" r="46" fill="#2f3f8f"/>
  <circle cx="234" cy="240" r="15" fill="#fff" opacity=".85"/>
  <circle cx="330" cy="174" r="9" fill="#3ecf6e"/>
