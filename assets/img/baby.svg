<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <!-- Illustration: sleeping baby in crib, top-down camera view, night colours -->
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.7">
      <stop offset="0" stop-color="#3a4f86"/>
      <stop offset="1" stop-color="#141b33"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b5a4a"/>
      <stop offset="1" stop-color="#4a3d33"/>
    </linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="2.2" fill="#8fa3d6" opacity=".35"/>
      <path d="M30 26 l2 4 4 .6 -3 2.8 .8 4.2 -3.8 -2 -3.8 2 .8 -4.2 -3 -2.8 4 -.6z" fill="#ffd46b" opacity=".25"/>
    </pattern>
    <linearGradient id="blanket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7f9be0"/>
      <stop offset="1" stop-color="#5a76c0"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" fill="#0d1226"/>
  <!-- crib frame -->
  <rect x="40" y="20" width="560" height="440" rx="26" fill="url(#wood)"/>
  <rect x="64" y="44" width="512" height="392" rx="16" fill="url(#glow)"/>
  <rect x="64" y="44" width="512" height="392" rx="16" fill="url(#dots)"/>
  <!-- crib bars seen from above (rail edge) -->
  <g fill="#7d6a57">
    <rect x="40" y="20" width="560" height="10" rx="5"/>
    <rect x="40" y="450" width="560" height="10" rx="5"/>
  </g>
  <!-- pillow -->
  <rect x="210" y="70" width="220" height="120" rx="50" fill="#c9d3ee" opacity=".9"/>
  <!-- star plush -->
  <g id="star" transform="translate(500 120) rotate(-12)">
    <path d="M0 -40 l11 24 26 3 -19 18 5 26 -23 -13 -23 13 5 -26 -19 -18 26 -3z" fill="#ffd46b"/>
    <path d="M-8 2 q4 4 8 0 M4 2 q4 4 8 0" stroke="#7a5a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
  <!-- moon plush -->
  <g transform="translate(130 360) rotate(18)">
    <path d="M-30 -36 a44 44 0 1 0 46 64 a36 36 0 1 1 -46 -64z" fill="#f5e6b0"/>
  </g>
  <!-- baby: swaddle (breathing) -->
  <g id="body" transform="translate(320 300)">
    <g id="breath">
      <ellipse cx="0" cy="0" rx="118" ry="118" fill="url(#blanket)"/>
      <path d="M-110 -18 q28 -16 55 0 t55 0 t55 0 t55 0" stroke="#3ecf6e" stroke-width="10" fill="none" stroke-linecap="round" opacity=".85"/>
      <path d="M-104 22 q26 -14 52 0 t52 0 t52 0 t52 0" stroke="#3ecf6e" stroke-width="8" fill="none" stroke-linecap="round" opacity=".55"/>
      <path d="M-60 -90 q60 40 120 0" stroke="#4d68b0" stroke-width="6" fill="none" opacity=".6"/>
    </g>
  </g>
  <!-- head -->
  <g transform="translate(320 165)">
    <circle r="70" fill="#e8c2a0"/>
    <!-- hood -->
    <path d="M-78 10 a80 82 0 0 1 156 0 q-10 -60 -78 -66 q-68 6 -78 66z" fill="#9fb4ea"/>
    <path d="M-20 -48 q10 -16 24 -6 q-10 2 -12 12z" fill="#7b5a44"/>
    <!-- closed eyes -->
    <path d="M-34 6 q12 10 24 0" stroke="#5a3d2e" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M10 6 q12 10 24 0" stroke="#5a3d2e" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <circle cx="-38" cy="26" r="10" fill="#f19a9a" opacity=".55"/>
    <circle cx="38" cy="26" r="10" fill="#f19a9a" opacity=".55"/>
    <path d="M-7 36 q7 6 14 0" stroke="#a5614f" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Zzz -->
  <g id="zzz" fill="#dfe6ff" font-family="DejaVu Sans, sans-serif" font-weight="700">
    <text id="z1" x="410" y="110" font-size="34">z</text>
    <text id="z2" x="440" y="80" font-size="26">z</text>
    <text id="z3" x="462" y="56" font-size="20">z</text>
  </g>
</svg>
